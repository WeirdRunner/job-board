# Publishes the GitHub Pages site (scripts/build_site.sh): the app, plus the board's Python that runs in the browser
# for boards kept in a browser. The site is static: a GitHub board's data is fetched encrypted from the `data` branch
# and only decrypted in your browser.
name: Pages
on:
  push:
    branches: [main]
    paths: ["web/**", "app/**", "scripts/build_site.sh", ".github/workflows/pages.yml"]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - run: sh scripts/build_site.sh _site
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with: { path: _site }
      - id: deploy
        uses: actions/deploy-pages@v4
